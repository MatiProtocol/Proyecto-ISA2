<app-custom-toast></app-custom-toast>
<c-container class="customWidth container-sm container-md container-lg container-xl container-xxl">
  <c-header-brand routerLink="/home">
    <b [ngStyle]="{ color: '#077F97' }">Pharma</b> Go
  </c-header-brand>
  <div *ngIf="icons">
    <c-header-nav>
      <c-nav-item title="Cart">
        <button class="customButton">
          <a routerLink="/home/cart" cNavLink>
            <svg cIcon name="cil-cart" size="lg"></svg>
            <span [ngStyle]="{ color: '#050505AE' }">Cart</span>
          </a>
          <c-badge class="customBadge" [ngStyle]="{ backgroundColor: '#077F97' }">{{
            badge
          }}</c-badge>
        </button>
      </c-nav-item>
      <c-nav-item title="Tracking Button">
        <a routerLink="/home/tracking" cNavLink>
          <svg cIcon name="cil-compass" size="lg"></svg>
          <span [ngStyle]="{ color: '#050505AE' }">Tracking</span>
        </a>
      </c-nav-item>

      <c-nav-item title="Bookings">
        <a routerLink="/home/bookings" cNavLink id="btn-bookings" aria-label="View bookings">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="19"
            height="19"
            style="vertical-align: middle; position: relative; top: -2.75px"
            fill="currentColor"
            class="bi bi-journal-bookmark"
            viewBox="0 0 16 16"
          >
            <path
              fill-rule="evenodd"
              d="M6 8V1h1v6.117L8.743 6.07a.5.5 0 0 1 .514 0L11 7.117V1h1v7a.5.5 0 0 1-.757.429L9 7.083 6.757 8.43A.5.5 0 0 1 6 8"
            />
            <path
              d="M3 0h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-1h1v1a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v1H1V2a2 2 0 0 1 2-2"
            />
            <path
              d="M1 5v-.5a.5.5 0 0 1 1 0V5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0V8h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0v.5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1z"
            />
          </svg>
        </a>
      </c-nav-item>
      <c-nav-item title="Pick Up">
        <a
          routerLink="/home/bookings/pick-up"
          cNavLink
          id="btn-pick-up"
          aria-label="Pick up booking"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            style="vertical-align: middle; position: relative; top: -2.75px"
            fill="currentColor"
            class="bi bi-box-seam"
            viewBox="0 0 16 16"
          >
            <path
              d="M8.186 1.113a.5.5 0 0 0-.372 0L1.846 3.5l2.404.961L10.404 2zm3.564 1.426L5.596 5 8 5.961 14.154 3.5zm3.25 1.7-6.5 2.6v7.922l6.5-2.6V4.24zM7.5 14.762V6.838L1 4.239v7.923zM7.443.184a1.5 1.5 0 0 1 1.114 0l7.129 2.852A.5.5 0 0 1 16 3.5v8.662a1 1 0 0 1-.629.928l-7.185 2.874a.5.5 0 0 1-.372 0L.63 13.09a1 1 0 0 1-.63-.928V3.5a.5.5 0 0 1 .314-.464z"
            />
          </svg>
        </a>
      </c-nav-item>
    </c-header-nav>
  </div>

  <c-header-nav class="ms-auto">
    <c-nav-item>
      <form class="d-flex">
        <div *ngIf="select" class="d-flex align-items-center">
          <label for="pharmacySelect" class="me-2 mb-0">Pharmacy:</label>
          <select class="form-select" #t (change)="onChangeSelect(t.value)" id="pharmacySelect">
            <option [value]="0">All Pharmacies</option>
            <option *ngFor="let item of pharmacys" [value]="item.id">{{ item.name }}</option>
          </select>
        </div>
      </form>
    </c-nav-item>
  </c-header-nav>

  <c-header-nav class="ms-auto">
    <c-nav-item>
      <div *ngIf="search">
        <form class="d-flex" role="search">
          <input
            cFormControl
            (search)="onSearch()"
            [(ngModel)]="searchValue"
            [value]="searchValue"
            class="form-control me-2"
            name="search"
            type="search"
            placeholder="Search"
            aria-label="Search"
          />
          <button
            class="btn btn-outline-info me-2"
            type="button"
            (click)="onSearch()"
            [ngStyle]="{ color: '#065E6F' }"
          >
            Search
          </button>
          <button
            class="btn btn-secondary me-2 text-nowrap"
            type="button"
            (click)="clearSearch()"
            aria-label="Clear search"
          >
            Clear search
          </button>

          <Button class="btn btn-info" type="button" (click)="navToLogin()">Login</Button>
        </form>
      </div>
    </c-nav-item>
  </c-header-nav>
</c-container>
