<app-user-header title="Employee" link="employee"></app-user-header>
<c-container [fluid]="true" class="mt-4">
  <div class="row">
    <div class="col-6 col-lg-3">
      <div class="card">
        <div class="card-block p-1 clearfix">
          <i class="fa fa-cogs bg-primary p-1 font-2xl mr-1 float-left"></i>
          <div class="h5 text-primary mb-0 mt-h"><h5>Drug</h5></div>
          <div class="text-muted text-uppercase font-weight-bold font-xs">Create</div>
        </div>
        <div class="card-footer p-x-1 py-h customCardIcon">
          <a
            class="font-weight-bold font-xs btn-block text-muted"
            routerLink="/employee/create-drug"
            >Go
            <svg cIcon [cIcon]="icons.cilArrowThickRight"></svg>
          </a>
        </div>
      </div>
    </div>

    <div class="col-6 col-lg-3">
      <div class="card">
        <div class="card-block p-1 clearfix">
          <i class="fa fa-cogs p-1 font-2xl mr-1 float-left" [ngStyle]="{ color: '#077F97' }"></i>
          <div class="h5 text-primary mb-0 mt-h"><h5>Drug</h5></div>
          <div class="text-muted text-uppercase font-weight-bold font-xs">Delete</div>
        </div>
        <div class="card-footer p-x-1 py-h customCardIcon">
          <a
            class="font-weight-bold font-xs btn-block text-muted"
            routerLink="/employee/delete-drug"
            >Go
            <svg cIcon [cIcon]="icons.cilArrowThickRight"></svg>
          </a>
        </div>
      </div>
    </div>

    <!--/.col-->
    <div class="col-6 col-lg-3">
      <div class="card">
        <div class="card-block p-1 clearfix">
          <i class="fa fa-laptop bg-info p-1 font-2xl mr-1 float-left"></i>
          <div class="h5 mb-0 mt-h" [ngStyle]="{ color: '#077F97' }"><h5>Stock</h5></div>
          <div class="text-muted text-uppercase font-weight-bold font-xs">Create Request</div>
        </div>
        <div class="card-footer p-x-1 py-h customCardIcon">
          <a
            class="font-weight-bold font-xs btn-block text-muted"
            routerLink="/employee/create-request"
            >Go
            <svg cIcon [cIcon]="icons.cilArrowThickRight"></svg>
          </a>
        </div>
      </div>
    </div>
    <!--/.col-->
    <div class="col-6 col-lg-3">
      <div class="card">
        <div class="card-block p-1 clearfix">
          <i class="fa fa-moon-o bg-warning p-1 font-2xl mr-1 float-left"></i>
          <div class="h5 mb-0 mt-h" [ngStyle]="{ color: '#705400' }"><h5>Purchase</h5></div>
          <div class="text-muted text-uppercase font-weight-bold font-xs">
            Approve / Reject Purchases
          </div>
        </div>
        <div class="card-footer p-x-1 py-h customCardIcon">
          <a
            class="font-weight-bold font-xs btn-block text-muted"
            routerLink="/employee/purchase-status"
          >
            Go
            <svg cIcon [cIcon]="icons.cilArrowThickRight"></svg>
          </a>
        </div>
      </div>
    </div>
    <!--/.col-->
  </div>
  <!--/.row-->
</c-container>
<c-header-divider></c-header-divider>
