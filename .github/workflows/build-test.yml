name: Build and Test

on:
  pull_request:
  push:
    branches: [main, develop]
    paths:
      # Backend
      - "**.cs"
      - "**.csproj"
      # Frontend
      - "src/Frontend/**"
      - "**.ts"
      - "**.html"
      - "package.json"
      - "package-lock.json"
      - "angular.json"

jobs:
  backend:
    name: Build and Test Backend
    uses: ./.github/workflows/reusable-build-test-backend.yml
    permissions: write-all
    with:
      solution-path: "./src/Backend"
      solution-name: "PharmaGo.sln"

  frontend:
    name: Build and Test Frontend
    uses: ./.github/workflows/reusable-build-test-frontend.yml
    permissions: write-all
    with:
      frontend-path: "./src/Frontend"
      node-version: "20.x"